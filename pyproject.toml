[project]
authors = [
    {name = "toro", email = "timofey89rus@gmail.com"},
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pyyaml>=6.0.2,<7.0.0"
]
name = "hexlet-code"
version = "0.1.0"
description = "Command-line app to find a difference between two JSON/YAML files"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]

[project.urls]
repository = "https://github.com/toro89rus/python-project-50"

[project.scripts]
gendiff = "gendiff.scripts.cli:main"

[dependency-groups]
dev = [
    "flake8<8.0.0,>=7.1.1",
    "pytest-cov<6.0.0,>=5.0.0",
    "pytest<9.0.0,>=8.3.3",
    "ruff<1.0.0,>=0.8.4",
]
